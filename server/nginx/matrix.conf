# Host Nginx configuration for matrix.dmi.unibas.ch
# Place in /etc/nginx/sites-available/matrix.dmi.unibas.ch.conf and symlink to /etc/nginx/sites-enabled/

# Port 80 (HTTP -> HTTPS redirect) is handled by the ALIS-managed `redirect` site,
# so we do not define our own port-80 block and stay out of the way of cert renewal.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matrix.dmi.unibas.ch;

    # Let's Encrypt cert issued and renewed by ALIS (wsym_letsencrypt)
    # Use the fullchain (leaf + intermediate), not cert.pem, and not the dmi-matrix.* host cert
    ssl_certificate     /etc/ssl/matrix.dmi.unibas.ch.fullchain.pem;
    ssl_certificate_key /etc/ssl/matrix.dmi.unibas.ch.privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Matrix client, federation, and well-known endpoints
    location ~ ^(/_matrix|/_synapse/client|/\.well-known/matrix) {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        client_max_body_size 50M;
    }

    # Synapse admin API, only from the uni network / VPN. Used by Ketesa running
    # locally on an admin's laptop (see docs/admin_ui.md); everyone else gets 403.
    location ^~ /_synapse/admin {
        allow 131.152.0.0/16;   # Uni Basel network
        allow 10.0.0.0/8;       # internal / VPN clients (e.g. 10.3.1.75)
        deny  all;

        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Static files served from the repo checkout (server/www)
    location = / {
        root /MARVIN/matrix-unibas/server/www;
        try_files /index.html =404;
    }

    location = /marvin.png {
        root /MARVIN/matrix-unibas/server/www;
        expires 7d;
    }

    location / {
        return 404;
    }
}
