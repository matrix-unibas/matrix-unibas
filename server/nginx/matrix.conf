# Host Nginx configuration for matrix.dmi.unibas.ch
# Place in /etc/nginx/sites-available/matrix.dmi.unibas.ch.conf and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name matrix.dmi.unibas.ch;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.dmi.unibas.ch;

    # SSL certificate paths
    # Replace with the actual Let's Encrypt / ITS certificate paths on the host
    ssl_certificate     /etc/ssl/certs/matrix.dmi.unibas.ch.crt;
    ssl_certificate_key /etc/ssl/private/matrix.dmi.unibas.ch.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Matrix client, federation, and well-known endpoints
    location ~ ^(/_matrix|/_synapse/client|/\.well-known/matrix) {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        client_max_body_size 50M;
    }

    # Block public access to the admin API (accessible only via SSH tunnel / admin UI)
    location /_synapse/admin {
        return 404;
    }

    location / {
        return 404;
    }
}
