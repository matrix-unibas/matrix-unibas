name: marvin

services:
  postgres:
    image: postgres:16-alpine
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    image: ghcr.io/element-hq/synapse:${SYNAPSE_IMAGE_TAG}
    container_name: matrix-synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
      - UID=${HOST_UID:-1000}
      - GID=${HOST_GID:-1000}
    volumes:
      - ./data:/data
      - ./consent_templates:/consent_templates:ro
    ports:
      - "127.0.0.1:${SYNAPSE_HTTP_PORT}:8008"

  nginx-admin:
    image: nginx:alpine
    container_name: matrix-admin-nginx
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:${ADMIN_UI_PORT}:8443"

  element:
    image: vectorim/element-web:${ELEMENT_IMAGE_TAG}
    container_name: matrix-element
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:${ELEMENT_HTTP_PORT}:80"

  maubot:
    image: dock.mau.dev/maubot/maubot:latest
    container_name: matrix-maubot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    volumes:
      - ./maubot:/data
    ports:
      - "127.0.0.1:${MAUBOT_UI_PORT}:29316"

  coturn:
    image: coturn/coturn:latest
    container_name: matrix-coturn
    restart: unless-stopped
    network_mode: host
    # Only our config, no default args: the image default runs detect-external-ip,
    # which fails on the VM and is not needed (public IP is directly on the interface)
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres_data: